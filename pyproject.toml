[build-system]
requires = ["hatchling", "hatch-vcs", "requests"]
build-backend = "hatchling.build"


[project]
name = "panda-common"
dynamic = ["version"]
description = " PanDA Common Package"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    { name = "PanDA Team", email = "panda-support@cern.ch" },
]
dependencies = [
    "pytz",
    "requests",
    "stomp.py >=8.1.2",
    "urllib3",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://panda-wms.readthedocs.io/en/latest/"


[tool.hatch.version]
path = "PandaPkgInfo.py"
pattern = "release_version = \"(?P<version>[^\"]+)\""


[tool.hatch.build]
directory = "dist"


[tool.hatch.build.targets.wheel]
exclude = ["*.template"]
packages = ["pandacommon"]


[tool.hatch.build.targets.wheel.shared-data]
"templates/panda_common.cfg.rpmnew" = "etc/panda/panda_common.cfg.rpmnew"
"tools/panda_common-install_igtf_ca" = "bin/panda_common-install_igtf_ca"


[tool.hatch.build.targets.wheel.hooks.custom]
path = "package/hatch_build.py"


[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
    ".idea"
]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
# F: pyflakes. The gate started as F821 alone, because an undefined name parses fine and
# raises at import time instead -- easy to hit with annotations, since the class named in
# one has to be imported even though nothing calls it. The rest of F costs nothing here
# and catches the same class of defect: F822 for a name missing from __all__, F811 for a
# definition silently shadowing an earlier one.
#
# I: import order, in place of isort. ruff's defaults already agree with ruff-format, so
# there is no profile to set.
#
# Syntax errors are reported whatever is selected, which is why there is no E9 here and
# no separate py_compile step in CI.
select = ["F", "I"]

# The tree is clean under these flags and CI fails on any finding, so a change that
# introduces one has to fix it. These match panda-server's [tool.mypy]. Keeping them and
# the pins in .pre-commit-config.yaml aligned with that repository is a convenience, not
# a requirement: its CI does not install this package, so the annotations here are Any to
# it. What alignment buys is that an upgrade is worked out once rather than twice.
[tool.mypy]
files = ["pandacommon"]
ignore_missing_imports = true
# Without this, mypy skips the body of every function that has no annotations. The
# modules panda-server imports are annotated; the rest are not, and this is what covers
# them.
check_untyped_defs = true

[tool.autopep8]
# https://pypi.org/project/autopep8/#pyproject-toml
max_line_length = 160
ignore = ["E501", "W6"]
in-place = true
recursive = true
aggressive = 3

[tool.pylint]
max-line-length = 160
[tool.pylint.'MESSAGES CONTROL']
disable = [
    "C0209",
    "R0902",
    "R0913",
    "R0914", #  R0914: Too many local variables
]